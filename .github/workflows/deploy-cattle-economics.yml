name: Deploy Cattle Economics

on:
  push:
    paths:
      - '.github/workflows/deploy-cattle-economics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout cattle economics source
        uses: actions/checkout@v4
        with:
          repository: swaizybusiness/feedlot-ration-intelligence-system
          ref: build/cattle-economic-intelligence-v1
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Run calculation tests
        working-directory: source
        run: npm test

      - name: Build application
        working-directory: source
        run: npm run build

      - name: Replace public cattle economics build
        run: |
          rm -rf site/cattle-economics
          mkdir -p site/cattle-economics
          cp -R source/dist/. site/cattle-economics/
          touch site/cattle-economics/.nojekyll

      - name: Commit public build
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cattle-economics
          if git diff --cached --quiet; then
            echo "No public build changes"
          else
            git commit -m "deploy: publish rebuilt rough feedlot calculator"
            git push
          fi

# deploy trigger: rebuilt rough feedlot calculator v0.4.5
